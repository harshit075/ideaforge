<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#E05315"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#E05315" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Subtle Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#44403C" stroke-width="1.5"/>

  <!-- Architectural Soundwave / Forge Spark Geometry -->
  <g filter="url(#glow)">
    <!-- Apex Forge Spark -->
    <path d="M32 10 L35 17 L42 20 L35 23 L32 30 L29 23 L22 20 L29 17 Z" fill="url(#amberGrad)"/>

    <!-- Left Soundwave Pillar -->
    <rect x="18" y="32" width="5" height="16" rx="2.5" fill="url(#terracottaGrad)"/>
    
    <!-- Central Main Forge Pillar -->
    <rect x="26" y="26" width="5.5" height="24" rx="2.75" fill="url(#terracottaGrad)"/>

    <!-- Focal Right Forge Pillar -->
    <rect x="34.5" y="26" width="5.5" height="24" rx="2.75" fill="url(#terracottaGrad)"/>

    <!-- Outer Right Soundwave Pillar -->
    <rect x="43" y="32" width="5" height="16" rx="2.5" fill="url(#terracottaGrad)"/>

    <!-- Connecting Foundation Arch -->
    <path d="M16 46 Q32 52 48 46" fill="none" stroke="url(#terracottaGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
